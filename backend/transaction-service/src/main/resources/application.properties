# transaction-service (cloud)
spring.application.name=transaction-service
server.port=${SERVER_PORT:8090}

# JWT validation. No fallback secret: startup fails if JWT_SECRET is missing.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Redis Configuration (Distributed Idempotency Lock)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Database Configuration (transaction_db / schema txn)
spring.datasource.url=jdbc:postgresql://${POSTGRES_CLOUD_HOST:localhost}:${POSTGRES_CLOUD_PORT:5435}/${POSTGRES_CLOUD_DB:transaction_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${POSTGRES_CLOUD_USER:postgres}
spring.datasource.password=${POSTGRES_CLOUD_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${POSTGRES_CLOUD_SCHEMA:txn}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:transaction-service-group}
# The consumer is built in KafkaConsumerConfig (string keys and values, earliest offset).
# There is no Kafka auto-configuration here, so spring.kafka.consumer.* deserializer keys do nothing.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.topics.stage-changed=${KAFKA_TOPIC_STAGE_CHANGED:transaction.stage.changed.v1}

# Actuator and metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Downstream internal service clients
app.clients.orchestration.base-url=${ORCHESTRATION_SERVICE_URL:http://localhost:8091}
app.clients.account.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8082}
app.clients.connect-timeout-ms=2000
app.clients.read-timeout-ms=3000

# Interbank remittance configuration (FIN-407)
app.interbank.own-bank-code=COOBS
app.interbank.allowed-timestamp-skew-seconds=300
app.interbank.default-settlement-account-id=9005
app.interbank.default-shared-secret=${INTERBANK_SHARED_SECRET:coobs-bankb-secret-2026}
app.interbank.partners.BANKB.bank-code=BANKB
app.interbank.partners.BANKB.shared-secret=${INTERBANK_BANKB_SECRET:coobs-bankb-secret-2026}
app.interbank.partners.BANKB.settlement-account-id=9005


