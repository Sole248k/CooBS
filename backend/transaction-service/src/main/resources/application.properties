# transaction-service (cloud)
spring.application.name=transaction-service
server.port=${SERVER_PORT:8090}

# JWT validation. Defaults to standard 256-bit test key for local development.
app.security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Redis Configuration (Distributed Idempotency Lock)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Database Configuration (transaction_db / schema txn)
spring.datasource.url=jdbc:postgresql://${POSTGRES_CLOUD_HOST:localhost}:${POSTGRES_CLOUD_PORT:5435}/${POSTGRES_CLOUD_DB:transaction_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${POSTGRES_CLOUD_USER:postgres}
spring.datasource.password=${POSTGRES_CLOUD_PASSWORD:postgres}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${POSTGRES_CLOUD_SCHEMA:txn}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:transaction-service-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
app.kafka.topics.stage-changed=${KAFKA_TOPIC_STAGE_CHANGED:transaction.stage.changed.v1}

# Actuator and metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

