# orchestration-service (cloud)
spring.application.name=orchestration-service
server.port=${SERVER_PORT:8091}

# JWT validation. No fallback secret: startup fails if JWT_SECRET is missing.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator and metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Saga store: transaction_db, schema saga (H12). Tables come from database/postgres-cloud/.
spring.datasource.url=jdbc:postgresql://${POSTGRES_CLOUD_HOST:localhost}:${POSTGRES_CLOUD_PORT:5435}/${POSTGRES_CLOUD_DB:transaction_db}
spring.datasource.username=${POSTGRES_CLOUD_USER:postgres}
spring.datasource.password=${POSTGRES_CLOUD_PASSWORD}
spring.jpa.properties.hibernate.default_schema=${POSTGRES_CLOUD_SCHEMA:saga}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:orchestration-service-group}

# Downstream services (H13). Every client has a timeout; the risk budget is 150 ms.
app.clients.customer.base-url=${CUSTOMER_SERVICE_URL:http://localhost:8089}
app.clients.customer.timeout=500ms
app.clients.risk.base-url=${RISK_ENGINE_URL:http://localhost:8092}
app.clients.risk.timeout=150ms
app.clients.ledger.base-url=${LEDGER_SERVICE_URL:http://localhost:8083}
app.clients.ledger.timeout=2s

# Capture after a hold is retried with the same idempotency key before the saga is left at its stage.
app.saga.capture-attempts=3
app.saga.capture-backoff=500ms
