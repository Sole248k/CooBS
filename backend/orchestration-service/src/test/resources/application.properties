spring.application.name=orchestration-service
app.security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.security.jwt.expiration-ms=86400000
app.security.cors.allowed-origins=http://localhost:3000

spring.datasource.url=jdbc:h2:mem:sagatest;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=orchestration-test-group
app.kafka.auto-startup=false

app.clients.customer.base-url=http://localhost:1
app.clients.customer.timeout=500ms
app.clients.risk.base-url=http://localhost:1
app.clients.risk.timeout=150ms
app.clients.ledger.base-url=http://localhost:1
app.clients.ledger.timeout=2s

app.saga.capture-attempts=3
app.saga.capture-backoff=0ms

# The warm-up would call the stub server and be counted in the saga tests.
app.warm-up.enabled=false
