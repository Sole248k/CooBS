# customer-service
spring.application.name=customer-service
server.port=${SERVER_PORT:8089}

# ==============================================================================
# Primary Datasource: PostgreSQL Cloud Database (customer_db)
# ==============================================================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_CLOUD_HOST:localhost}:${POSTGRES_CLOUD_PORT:5435}/${POSTGRES_CLOUD_DB:customer_db}
spring.datasource.username=${POSTGRES_CLOUD_USER:postgres}
spring.datasource.password=${POSTGRES_CLOUD_PASSWORD:${POSTGRES_PASSWORD:AuditPassword123!}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# ==============================================================================
# JPA / Hibernate Configurations
# ==============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# Redis Configuration (Distributed Token Blacklist)
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# ==============================================================================
# Security, JWT & CORS Configuration
# ==============================================================================
app.security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ==============================================================================
# Downstream Services
# ==============================================================================
app.clients.account.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8082}
app.clients.account.connect-timeout-ms=${ACCOUNT_SERVICE_CONNECT_TIMEOUT_MS:2000}
app.clients.account.read-timeout-ms=${ACCOUNT_SERVICE_READ_TIMEOUT_MS:5000}
app.clients.transaction.base-url=${TRANSACTION_SERVICE_URL:http://localhost:8090}
app.clients.transaction.connect-timeout-ms=${TRANSACTION_SERVICE_CONNECT_TIMEOUT_MS:2000}
app.clients.transaction.read-timeout-ms=${TRANSACTION_SERVICE_READ_TIMEOUT_MS:5000}

# ==============================================================================
# Actuator & Metrics
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
