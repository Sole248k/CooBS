# staff-bff Configuration
spring.application.name=staff-bff
server.port=${SERVER_PORT:8095}

# ==============================================================================
# Security, JWT & CORS Configuration
# ==============================================================================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ==============================================================================
# Downstream Microservices Base URLs
# ==============================================================================
app.clients.customer.base-url=${CUSTOMER_SERVICE_URL:http://localhost:8089}
app.clients.account.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8082}
app.clients.ledger.base-url=${LEDGER_SERVICE_URL:http://localhost:8083}
app.clients.transaction.base-url=${TRANSACTION_SERVICE_URL:http://localhost:8090}
app.clients.audit.base-url=${AUDIT_SERVICE_URL:http://localhost:8085}
app.clients.batch.base-url=${BATCH_SERVICE_URL:http://localhost:8093}
app.clients.notification.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}

# Client Timeouts (in milliseconds)
app.clients.connect-timeout-ms=${CLIENT_CONNECT_TIMEOUT_MS:2000}
app.clients.read-timeout-ms=${CLIENT_READ_TIMEOUT_MS:15000}

# ==============================================================================
# Actuator & Observability
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
