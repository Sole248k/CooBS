server.port=${SERVER_PORT:8084}
spring.application.name=notification-service

# Database Configuration (PostgreSQL Cloud DB / notification_db)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5435/notification_db}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:AuditPassword123!}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Apache Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notification-service-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Topics
notification.kafka.topics.mutation=${KAFKA_TOPIC_MUTATION:ledger.mutation.completed.v1}
notification.kafka.topics.transfer=${KAFKA_TOPIC_TRANSFER:ledger.transfer.completed.v1}
notification.kafka.topics.transfer-failed=${KAFKA_TOPIC_TRANSFER_FAILED:ledger.transfer.failed.v1}
notification.kafka.topics.account-closure=${KAFKA_TOPIC_ACCOUNT_CLOSURE:account.closure.completed.v1}
notification.kafka.topics.kyc-submitted=${KAFKA_TOPIC_KYC_SUBMITTED:kyc.request.submitted.v1}
notification.kafka.topics.kyc-evaluated=${KAFKA_TOPIC_KYC_EVALUATED:kyc.request.evaluated.v1}
notification.kafka.topics.dlt=${KAFKA_TOPIC_DLT:notification.events.DLT}

# Kafka Retry & DLQ Backoff
notification.kafka.retry.max-attempts=${KAFKA_RETRY_MAX_ATTEMPTS:3}
notification.kafka.retry.initial-interval-ms=${KAFKA_RETRY_INITIAL_INTERVAL_MS:1000}
notification.kafka.retry.multiplier=${KAFKA_RETRY_MULTIPLIER:2.0}

# Security Configuration
security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
