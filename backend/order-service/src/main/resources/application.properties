server.port=${SERVER_PORT:8096}
spring.application.name=order-service

# ==============================================================================
# Datasource: order_db, the shop's own cloud database (PostgreSQL locally, Azure SQL deployed).
# The system of record stays in Oracle and is reached only through ledger-service.
# ==============================================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5435/order_db}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3

# ==============================================================================
# JPA / Hibernate Configurations
# ==============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==============================================================================
# Security, JWT & Downstream Service URLs
# ==============================================================================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.clients.ledger.base-url=${LEDGER_SERVICE_URL:http://localhost:8083}
app.shop.default-merchant-account-id=${SHOP_MERCHANT_ACCOUNT_ID:1001}

# Actuator & Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
