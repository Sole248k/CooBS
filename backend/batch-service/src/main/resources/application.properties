# batch-service (onprem)
spring.application.name=batch-service
server.port=${SERVER_PORT:8093}

# ==============================================================================
# Primary Datasource: PostgreSQL (Batch Engine & Forensic Audit Store -> JPA)
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:audit_store}?currentSchema=batch,audit_store,public}
spring.datasource.username=${POSTGRES_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${POSTGRES_PASSWORD:${SPRING_DATASOURCE_PASSWORD:AuditPassword123!}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ==============================================================================
# Secondary Datasource: Oracle XE (Master System of Record & General Ledger)
# ==============================================================================
oracle.datasource.url=jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1522}/${ORACLE_DATABASE:XEPDB1}
oracle.datasource.username=${APP_USER:core_user}
oracle.datasource.password=${APP_USER_PASSWORD:CorePassword123!}
oracle.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==============================================================================
# Core Service Integration
# ==============================================================================
ledger.service.url=${LEDGER_SERVICE_URL:http://localhost:8083}

# ==============================================================================
# JPA / Hibernate Configurations
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==============================================================================
# Security, JWT & CORS Configuration
# ==============================================================================
app.security.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1qd3Qtc2VjcmV0LWZvci1ncm91cDItZnNlLWNhcHN0b25lLXByb2plY3QtMjAyNQ==}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ==============================================================================
# Actuator and metrics
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
