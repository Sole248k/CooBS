server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  cloud:
    gateway:
      filter:
        request-rate-limiter:
          deny-empty-key: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:5173"
              - "http://localhost:8000"
              - "http://127.0.0.1:8000"
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - "X-Correlation-ID"
              - "Authorization"
              - "Idempotency-Key"
              - "Content-Disposition"
              - "Location"
              - "X-RateLimit-Remaining"
              - "X-RateLimit-Burst-Capacity"
              - "X-RateLimit-Replenish-Rate"
              - "X-RateLimit-Requested-Tokens"
            allowCredentials: true
            maxAge: 3600
      routes:
        # 1. Auth Service Routes (Identity, Registration, MFA, Token Refresh)
        # Strictest limits: 10 req/s, burst 20 to protect against credential brute forcing
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # 2. Account Service Routes (Accounts Lifecycle, Closure & Holds)
        # Operational query limits: 50 req/s, burst 100
        - id: account-service-accounts-route
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

        # 2b. Customer Service Routes (Profile, KYC & Beneficiaries)
        - id: customer-service-route
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

        # 3. Ledger Service Routes (Double-Entry Mutations, Transfers, Balances)
        # Transaction mutation limits: 20 req/s, burst 40 to protect database locks
        - id: ledger-service-route
          uri: ${LEDGER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/ledger/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

        # 4. Notification Service Routes (In-App Notification Feed & SSE/WebSockets)
        # Polling and feed query limits: 50 req/s, burst 100
        - id: notification-service-route
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

        # 5. Audit Service Routes (Forensic Audit Logs & Merkle Proofs)
        # Hash and proof calculation limits: 30 req/s, burst 60
        - id: audit-service-route
          uri: ${AUDIT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/audit/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

        # 6. Transaction Service Routes (transfer ingress, timeline, reversal, DLQ replay)
        - id: transaction-service-route
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

        # 7. Inter-bank Routes (partner banks; signed requests, hosted by transaction-service)
        - id: transaction-service-interbank-route
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/v1/interbank/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

        # 8. Batch Service Routes (on-demand end-of-day pipeline)
        - id: batch-service-route
          uri: ${BATCH_SERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/batch/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

        # 9. Mobile BFF Routes (Screen Aggregation & Stepper Adapter)
        - id: mobile-bff-route
          uri: ${MOBILE_BFF_URL:http://localhost:8094}
          predicates:
            - Path=/api/v1/mobile/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

        # 10. Orchestration Service Routes (Transfer and Reversal Saga Coordinator)
        # Saga and compensation query limits: 20 req/s, burst 40
        - id: orchestration-service-route
          uri: ${ORCHESTRATION_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/orchestration/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

        # 11. Risk Engine Routes (Internal-only perimeter; blocked by InternalPerimeterRejectionFilter)
        # Internal service routing: 30 req/s, burst 60
        - id: risk-engine-route
          uri: ${RISK_ENGINE_URL:http://localhost:8092}
          predicates:
            - Path=/internal/v1/risk/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO
    com.group2.fse.api_gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.filter.ratelimit: DEBUG
    org.springframework.web.reactive: INFO
