server.port=8081
spring.application.name=auth-service-test

# PostgreSQL Test Connection (Points to local postgres-cloud-db container)
spring.datasource.url=jdbc:postgresql://${POSTGRES_CLOUD_HOST:localhost}:${POSTGRES_CLOUD_PORT:5435}/${POSTGRES_CLOUD_DB:identity_db}
spring.datasource.username=${POSTGRES_CLOUD_USER:postgres}
spring.datasource.password=${POSTGRES_CLOUD_PASSWORD:${POSTGRES_PASSWORD:AuditPassword123!}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Test Connection
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# JWT Test Configuration
app.security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.security.jwt.expiration-ms=900000
app.security.jwt.refresh-expiration-ms=604800000
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Actuator
management.endpoints.web.exposure.include=health,info
