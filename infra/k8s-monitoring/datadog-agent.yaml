# The Datadog agent for the cluster: one pod on the node. GENERATED, do not edit by hand.
#
# Change infra/k8s-monitoring/datadog-values.yaml and render again:
#
#   helm repo add datadog https://helm.datadoghq.com
#   helm template datadog datadog/datadog --version 3.253.2 --namespace datadog --kube-version 1.35.8 -f infra/k8s-monitoring/datadog-values.yaml
#
# then put this header and the Namespace below back on top of the output.
#
# Not in any kustomization. infra/scripts/deploy-cloud.ps1 applies it when Key Vault holds the
# secret datadog-api-key, after copying that key into the Secret datadog-secret and putting
# the account's site in place of REPLACE-datadog-site. Without the key nothing is applied.
apiVersion: v1
kind: Namespace
metadata:
  name: datadog
  labels:
    app.kubernetes.io/part-of: coobs
---
