apiVersion: v1
kind: ConfigMap
metadata:
  name: datadog-confd
  namespace: datadog
  labels:
    helm.sh/chart: 'datadog-3.253.2'
    app.kubernetes.io/name: "datadog"
    app.kubernetes.io/instance: "datadog"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "7"
  annotations:
    checksum/confd-config: e8cade6a8a912c530ee34ef3f3aa3e3dc0794a5c8982c0e91201ae2dfc945570
    checksum/autoconf-config: 74234e98afe7498fb5daf1f36ac2d78acc339464f950703b8c019892f982b90b
data:

  openmetrics.yaml: |-
    # mobile-bff is not in the list: it answers /actuator/prometheus only to an admin token
    # (its SecurityConfig), so a check on it fails with 401 every time. Its logs and its
    # container figures are collected like everyone's, and its calls show at the gateway.
    ad_identifiers:
      - api-gateway
      - staff-bff
      - auth-service
      - customer-service
      - transaction-service
      - orchestration-service
      - risk-engine
      - notification-service
    init_config:
    instances:
      - openmetrics_endpoint: "http://%%host%%:%%port%%/actuator/prometheus"
        namespace: coobs
        metrics:
          - http_server_requests_seconds.*
          - spring_cloud_gateway_requests_seconds.*
          - spring_kafka_listener_seconds.*
          - hikaricp_connections.*
          - jvm_memory_used_bytes
          - jvm_threads_live_threads
          - jvm_gc_pause_seconds.*
          - process_cpu_usage
          - system_cpu_usage
          - process_uptime_seconds
          - logback_events.*
