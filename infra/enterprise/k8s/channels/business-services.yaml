# The five business services, seen from the channels cluster. Each address is the fixed private
# address ../services/kustomization.yaml gives that service's internal load balancer.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: auth-service-business
  labels:
    kubernetes.io/service-name: auth-service
    coobs/zone: business
addressType: IPv4
ports:
  - name: http
    port: 8081
    protocol: TCP
endpoints:
  - addresses:
      - "10.240.15.211"
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: customer-service-business
  labels:
    kubernetes.io/service-name: customer-service
    coobs/zone: business
addressType: IPv4
ports:
