# Transfer, reversal and inbound inter-bank sagas.
# Values mirror the orchestration-service block in docker-compose.yml; names are in contracts/runtime/RUNTIME_SETTINGS.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration-service
  labels:
    app.kubernetes.io/name: orchestration-service
    app.kubernetes.io/part-of: coobs
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestration-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestration-service
        app.kubernetes.io/part-of: coobs
    spec:
      automountServiceAccountToken: false
      # No service-link variables (<NAME>_SERVICE_HOST, <NAME>_PORT): every address comes from coobs-config.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestration-service
          image: coobs/orchestration-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8091
          env:
            - name: SERVER_PORT
              value: "8091"
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: JAVA_OPTS
            # Azure SQL, database transaction_db. SQL_SERVER_FQDN must stay above the URL that uses it.
            - name: SQL_SERVER_FQDN
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: SQL_SERVER_FQDN
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:sqlserver://$(SQL_SERVER_FQDN):1433;databaseName=transaction_db;encrypt=true;trustServerCertificate=false;loginTimeout=30"
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "com.microsoft.sqlserver.jdbc.SQLServerDriver"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: CLOUD_DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: CLOUD_DB_PASSWORD
            - name: SPRING_JPA_DATABASE_PLATFORM
              value: "org.hibernate.dialect.SQLServerDialect"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: "org.hibernate.dialect.SQLServerDialect"
            # Still named in application.properties with no default, so it is supplied as well.
            - name: POSTGRES_CLOUD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: CLOUD_DB_PASSWORD
            - name: POSTGRES_CLOUD_SCHEMA
              value: "saga"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "20"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "5"
            - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
              value: "5000"
            - name: SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD
              value: "15000"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_CONSUMER_GROUP
              value: "orchestration-service-group"
            - name: CUSTOMER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: CUSTOMER_SERVICE_URL
            - name: RISK_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: RISK_ENGINE_URL
            # Crosses the link: the only cloud service that calls the ledger
            - name: LEDGER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: LEDGER_SERVICE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION_MS
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: JWT_EXPIRATION_MS
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: CORS_ALLOWED_ORIGINS
          # Eight JVMs start together on two vCPUs, so the first start is allowed six minutes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 72
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: orchestration-service
  labels:
    app.kubernetes.io/name: orchestration-service
    app.kubernetes.io/part-of: coobs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orchestration-service
  ports:
    - name: http
      port: 8091
      targetPort: http
