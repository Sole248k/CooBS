# Fraud and limit decisions. Redis only; no database.
# Values mirror the risk-engine block in docker-compose.yml; names are in contracts/runtime/RUNTIME_SETTINGS.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  labels:
    app.kubernetes.io/name: risk-engine
    app.kubernetes.io/part-of: coobs
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-engine
        app.kubernetes.io/part-of: coobs
    spec:
      automountServiceAccountToken: false
      # No service-link variables (<NAME>_SERVICE_HOST, <NAME>_PORT): every address comes from coobs-config.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: risk-engine
          image: coobs/risk-engine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8092
          env:
            - name: SERVER_PORT
              value: "8092"
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: JAVA_OPTS
            # Redis. The key and TLS switch are Spring's own names; no service reads them from a custom variable.
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: REDIS_PORT
            - name: SPRING_DATA_REDIS_SSL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: REDIS_SSL_ENABLED
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: REDIS_PASSWORD
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: INTERNAL_SERVICE_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION_MS
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: JWT_EXPIRATION_MS
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: CORS_ALLOWED_ORIGINS
          # Eight JVMs start together on two vCPUs, so the first start is allowed six minutes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 72
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: risk-engine
  labels:
    app.kubernetes.io/name: risk-engine
    app.kubernetes.io/part-of: coobs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: risk-engine
  ports:
    - name: http
      port: 8092
      targetPort: http
