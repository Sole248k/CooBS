# TEMPLATE ONLY. Not listed in kustomization.yaml and never applied as it stands.
#
# The real Secret is created at deploy time from Key Vault, so no value is ever written to a file
# in this repository. This file exists to document the keys the workloads expect.
# Do not fill it in and commit it.
#
# Key                      Read by                                            Key Vault secret (keyvault.bicep)
# JWT_SECRET               every service except api-gateway                   jwt-secret
# INTERNAL_SERVICE_SECRET  risk-engine                                        internal-service-secret
# CLOUD_DB_PASSWORD        auth, customer, transaction, orchestration,        postgres-password, to be renamed for Azure SQL
#                          notification
# REDIS_PASSWORD           api-gateway, auth, customer, transaction, risk     redis-key
# INTERBANK_SHARED_SECRET  transaction-service                                not in Key Vault yet
# INTERBANK_BANKB_SECRET   transaction-service                                not in Key Vault yet
apiVersion: v1
kind: Secret
metadata:
  name: coobs-app-secrets
  namespace: coobs
type: Opaque
stringData:
  JWT_SECRET: ""
  INTERNAL_SERVICE_SECRET: ""
  CLOUD_DB_PASSWORD: ""
  REDIS_PASSWORD: ""
  INTERBANK_SHARED_SECRET: ""
  INTERBANK_BANKB_SECRET: ""
