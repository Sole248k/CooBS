# TEMPLATE ONLY. Not listed in kustomization.yaml and never applied as it stands.
#
# The real Secret is created by infra/scripts/deploy-cloud.ps1 from Key Vault, so no value is ever written to a file
# in this repository. This file exists to document the keys the workloads expect.
# Do not fill it in and commit it.
#
# Key                      Read by                                            Key Vault secret
# JWT_SECRET               every service except api-gateway                   jwt-secret
# INTERNAL_SERVICE_SECRET  risk-engine                                        internal-service-secret
# CLOUD_DB_PASSWORD        auth, customer, transaction, orchestration,        cloud-db-password (written by the Bicep)
#                          notification
# REDIS_PASSWORD           api-gateway, auth, customer, transaction, risk     redis-key (written by the Bicep)
# INTERBANK_SHARED_SECRET  transaction-service                                interbank-shared-secret
# INTERBANK_BANKB_SECRET   transaction-service                                interbank-bankb-secret
# STAFF_PASSWORD           the schema job only (jobs/load-schemas.yaml)       staff-password
apiVersion: v1
kind: Secret
metadata:
  name: coobs-app-secrets
  namespace: coobs
type: Opaque
stringData:
  JWT_SECRET: ""
  INTERNAL_SERVICE_SECRET: ""
  CLOUD_DB_PASSWORD: ""
  REDIS_PASSWORD: ""
  INTERBANK_SHARED_SECRET: ""
  INTERBANK_BANKB_SECRET: ""
  STAFF_PASSWORD: ""
