# The members' shop: catalogue, orders, and payment through the ledger's hold, capture and release.
# A cloud service with its own database (order_db). It uses no Redis and no Kafka.
# Values mirror the order-service block in docker-compose.yml; names are in contracts/runtime/RUNTIME_SETTINGS.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: coobs
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: coobs
    spec:
      automountServiceAccountToken: false
      # No service-link variables (<NAME>_SERVICE_HOST, <NAME>_PORT): every address comes from coobs-config.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-service
          image: coobs/order-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8096
          env:
            - name: SERVER_PORT
              value: "8096"
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: JAVA_OPTS
            # Azure SQL, database order_db. The shop's catalogue and orders; no money is kept here.
            - name: SQL_SERVER_FQDN
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: SQL_SERVER_FQDN
            - name: DATABASE_URL
              value: "jdbc:sqlserver://$(SQL_SERVER_FQDN):1433;databaseName=order_db;encrypt=true;trustServerCertificate=false;loginTimeout=30"
            - name: DATABASE_DRIVER
              value: "com.microsoft.sqlserver.jdbc.SQLServerDriver"
            - name: DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: CLOUD_DB_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: CLOUD_DB_PASSWORD
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "20"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "5"
            - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
              value: "5000"
            - name: SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD
              value: "15000"
            # The only call that leaves the cloud zone: hold, capture and release at the ledger.
            - name: LEDGER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: LEDGER_SERVICE_URL
            - name: SHOP_MERCHANT_ACCOUNT_ID
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: SHOP_MERCHANT_ACCOUNT_ID
            - name: JWT_EXPIRATION_MS
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: JWT_EXPIRATION_MS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: JWT_SECRET
          # Eight JVMs start together on two vCPUs, so the first start is allowed six minutes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 72
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              # 50m, not 100m: the node has 1900m to give, AKS's own pods reserve about 1160m of it,
              # and at 100m four pods found no room on the first deployment. It is not a limit.
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 640Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: coobs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 8096
      targetPort: http
