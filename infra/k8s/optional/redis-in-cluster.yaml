# FALLBACK, not listed in kustomization.yaml. Use only if Azure Managed Redis cannot be created on
# the subscription or fails its first connection test.
#
# To switch:
#   1. Add "optional/redis-in-cluster.yaml" to resources in kustomization.yaml.
#   2. In config.yaml set REDIS_HOST "redis-cache", REDIS_PORT "6379", REDIS_SSL_ENABLED "false".
#   3. Add the redis-external address below to the replacements in kustomization.yaml, or edit it here.
#   4. On the VM set REDIS_HOST to that address and REDIS_PORT to 6379.
# Same image as redis-cache in docker-compose.yml. It requires the same REDIS_PASSWORD the services send.
# Data is kept in memory and on the pod's own disk only: a restart clears tokens and risk counters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  labels:
    app.kubernetes.io/name: redis-cache
    app.kubernetes.io/part-of: coobs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-cache
        app.kubernetes.io/part-of: coobs
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  labels:
    app.kubernetes.io/name: redis-cache
    app.kubernetes.io/part-of: coobs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Private address for the on-premises VM (token blacklist and idempotency lookups).
apiVersion: v1
kind: Service
metadata:
  name: redis-external
  labels:
    app.kubernetes.io/name: redis-cache
    app.kubernetes.io/part-of: coobs
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "10.240.15.201"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: redis-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
