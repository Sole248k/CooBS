# Loads the four cloud databases in Azure SQL from database/azure-sql/. Not in kustomization.yaml:
# infra/scripts/deploy-cloud.ps1 creates the two ConfigMaps it reads, applies it, and waits.
#
# It runs in the cluster because Azure SQL accepts connections from the AKS subnet only.
# The image is the SQL Server one, used only for its sqlcmd; no database engine is started.
#
#   coobs-sql-scripts   the four script files, from database/azure-sql/
#   coobs-sql-target    SQL_SERVER_FQDN and CLOUD_DB_USER
#   coobs-app-secrets   CLOUD_DB_PASSWORD and STAFF_PASSWORD
#
# The scripts cannot run twice, so a database is loaded only when it has no tables, and a
# finished load is marked with the extended property coobs_seed. Tables without the mark mean
# a load stopped half way: the job fails and says so. Recreate that database and run it again.
#
# The seed gives every sign-in one password that is written in this repository. That is fine
# for the members of a demo and not for admin and the tellers on a public address, so the last
# step replaces the staff hashes with the hash of STAFF_PASSWORD, on every run. The hash is made
# by htpasswd in the first container (bcrypt, cost 10, the form auth-service reads).
#
# With RESET_DATA=true (deploy-cloud.ps1 -ResetData) it first empties Redis and removes every
# table from the four databases, so the load that follows puts the seed back. The script stops
# the services before it runs this, because a service that writes during the load breaks it.
apiVersion: batch/v1
kind: Job
metadata:
  name: coobs-load-schemas
  namespace: coobs
  labels:
    app.kubernetes.io/part-of: coobs
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: coobs
    spec:
      restartPolicy: Never
      initContainers:
        - name: hash-staff-password
          image: httpd:2.4-alpine
          env:
            - name: STAFF_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: STAFF_PASSWORD
          command:
            - /bin/sh
            - -ec
            - |
              # htpasswd prints ":<hash>" and a blank line; only the hash is kept.
              printf '%s' "$STAFF_PASSWORD" | htpasswd -inBC 10 "" | tr -d ':\n' > /work/staff.hash
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
        # Only on a reset. The risk engine's counters, the idempotency keys and the sessions in
        # Redis belong to the data that is about to be removed. The two settings are optional
        # because on the very first deployment coobs-config does not exist yet.
        - name: flush-redis
          image: redis:7-alpine
          env:
            - name: RESET_DATA
              valueFrom:
                configMapKeyRef:
                  name: coobs-sql-target
                  key: RESET_DATA
                  optional: true
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: REDIS_HOST
                  optional: true
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: REDIS_PORT
                  optional: true
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: REDIS_PASSWORD
          command:
            - /bin/sh
            - -ec
            - |
              if [ "$RESET_DATA" != "true" ]; then echo "No reset asked for; Redis is left alone."; exit 0; fi
              # -e: an error answer from Redis fails this container, and with it the job, before
              # any database is touched.
              redis-cli -e -h "$REDIS_HOST" -p "$REDIS_PORT" --tls --no-auth-warning FLUSHALL
              echo "Redis is empty."
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: sqlcmd
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: SQL_SERVER_FQDN
              valueFrom:
                configMapKeyRef:
                  name: coobs-sql-target
                  key: SQL_SERVER_FQDN
            - name: CLOUD_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: coobs-sql-target
                  key: CLOUD_DB_USER
            - name: SQLCMDPASSWORD
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: CLOUD_DB_PASSWORD
            - name: RESET_DATA
              valueFrom:
                configMapKeyRef:
                  name: coobs-sql-target
                  key: RESET_DATA
                  optional: true
          command:
            - /bin/bash
            - -ec
            - |
              run() { /opt/mssql-tools18/bin/sqlcmd -S "$SQL_SERVER_FQDN" -U "$CLOUD_DB_USER" -I -b -x -f 65001 -l 60 "$@"; }
              count() { run -d "$1" -h -1 -W -Q "SET NOCOUNT ON; $2" | tr -d '[:space:]'; }
              load() {
                db="$1"; file="$2"
                marked=$(count "$db" "SELECT COUNT(*) FROM sys.extended_properties WHERE class = 0 AND name = N'coobs_seed'")
                tables=$(count "$db" "SELECT COUNT(*) FROM sys.tables")
                if [ "$marked" != "0" ]; then
                  echo "$db: already loaded, skipped"
                elif [ "$tables" != "0" ]; then
                  echo "$db: has $tables table(s) but no finished load. Recreate the database, then run this again." >&2
                  exit 1
                else
                  echo "$db: loading $file"
                  run -d "$db" -i "/scripts/$file"
                  run -d "$db" -Q "EXEC sys.sp_addextendedproperty @name = N'coobs_seed', @value = N'done'"
                  echo "$db: loaded"
                fi
              }
              # The scripts create tables and indexes only, so a database with its foreign keys,
              # tables and the mark removed is as good as new.
              wipe() {
                echo "$1: removing every table"
                run -d "$1" -Q "SET NOCOUNT ON;
                  DECLARE @keys NVARCHAR(MAX) = (SELECT STRING_AGG(CAST(N'ALTER TABLE ' + QUOTENAME(SCHEMA_NAME(t.schema_id)) + N'.' + QUOTENAME(t.name) + N' DROP CONSTRAINT ' + QUOTENAME(f.name) AS NVARCHAR(MAX)), N'; ') FROM sys.foreign_keys f JOIN sys.tables t ON t.object_id = f.parent_object_id);
                  DECLARE @tables NVARCHAR(MAX) = (SELECT STRING_AGG(CAST(N'DROP TABLE ' + QUOTENAME(SCHEMA_NAME(schema_id)) + N'.' + QUOTENAME(name) AS NVARCHAR(MAX)), N'; ') FROM sys.tables);
                  IF @keys IS NOT NULL EXEC sys.sp_executesql @keys;
                  IF @tables IS NOT NULL EXEC sys.sp_executesql @tables;
                  IF EXISTS (SELECT 1 FROM sys.extended_properties WHERE class = 0 AND name = N'coobs_seed') EXEC sys.sp_dropextendedproperty @name = N'coobs_seed';"
              }
              if [ "$RESET_DATA" = "true" ]; then
                for db in identity_db customer_db transaction_db notification_db; do wipe "$db"; done
              fi
              load identity_db     02_identity_db.sql
              load customer_db     03_customer_db.sql
              load transaction_db  04_transaction_db.sql
              load notification_db 05_notification_db.sql
              echo "Cloud databases are loaded."

              hash=$(cat /work/staff.hash)
              case "$hash" in
                '$2'?'$10$'*) ;;
                *) echo "The staff password hash was not produced; the staff sign-ins were not changed." >&2; exit 1 ;;
              esac
              # A bcrypt hash holds letters, digits, dots, slashes and dollar signs only, and sqlcmd
              # runs with -x, so it is safe inside the quotes.
              run -d identity_db -Q "SET NOCOUNT ON; UPDATE app_user SET password_hash = '$hash' WHERE user_type = 'STAFF'"
              echo "Staff sign-ins use the password from Key Vault."
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
              readOnly: true
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: scripts
          configMap:
            name: coobs-sql-scripts
        - name: work
          emptyDir:
            medium: Memory
