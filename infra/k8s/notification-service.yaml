# Event consumer and the in-app notification feed.
# Values mirror the notification-service block in docker-compose.yml; names are in contracts/runtime/RUNTIME_SETTINGS.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: coobs
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: coobs
    spec:
      automountServiceAccountToken: false
      # No service-link variables (<NAME>_SERVICE_HOST, <NAME>_PORT): every address comes from coobs-config.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-service
          image: coobs/notification-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: JAVA_OPTS
            # Azure SQL, database notification_db. This service reads its own DATABASE_* names.
            - name: SQL_SERVER_FQDN
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: SQL_SERVER_FQDN
            - name: DATABASE_URL
              value: "jdbc:sqlserver://$(SQL_SERVER_FQDN):1433;databaseName=notification_db;encrypt=true;trustServerCertificate=false;loginTimeout=30"
            - name: DATABASE_DRIVER
              value: "com.microsoft.sqlserver.jdbc.SQLServerDriver"
            - name: DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: CLOUD_DB_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: CLOUD_DB_PASSWORD
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "20"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "5"
            - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
              value: "5000"
            - name: SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD
              value: "15000"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_CONSUMER_GROUP
              value: "notification-service-group"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: JWT_SECRET
          # Eight JVMs start together on two vCPUs, so the first start is allowed six minutes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 72
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: coobs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - name: http
      port: 8084
      targetPort: http
