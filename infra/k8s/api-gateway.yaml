# Spring Cloud Gateway. The only workload with a public address.
# Values mirror the api-gateway block in docker-compose.yml; names are in contracts/runtime/RUNTIME_SETTINGS.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: coobs
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: coobs
    spec:
      automountServiceAccountToken: false
      # No service-link variables (<NAME>_SERVICE_HOST, <NAME>_PORT): every address comes from coobs-config.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: coobs/api-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: JAVA_OPTS
            # Routes to the cloud services
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: AUTH_SERVICE_URL
            - name: CUSTOMER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: CUSTOMER_SERVICE_URL
            - name: TRANSACTION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: TRANSACTION_SERVICE_URL
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: NOTIFICATION_SERVICE_URL
            - name: ORCHESTRATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: ORCHESTRATION_SERVICE_URL
            - name: RISK_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: RISK_ENGINE_URL
            - name: MOBILE_BFF_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: MOBILE_BFF_URL
            # Routes that cross the link to the on-premises services
            - name: ACCOUNT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: ACCOUNT_SERVICE_URL
            - name: LEDGER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: LEDGER_SERVICE_URL
            - name: AUDIT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: AUDIT_SERVICE_URL
            - name: BATCH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: BATCH_SERVICE_URL
            # Redis. The key and TLS switch are Spring's own names; no service reads them from a custom variable.
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: REDIS_PORT
            - name: SPRING_DATA_REDIS_SSL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: coobs-config
                  key: REDIS_SSL_ENABLED
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coobs-app-secrets
                  key: REDIS_PASSWORD
          # Eight JVMs start together on two vCPUs, so the first start is allowed six minutes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 72
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: coobs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The one public entry point. Front Door, when added, uses this address as its origin.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-public
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: coobs
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
